[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "^0.8.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sea-orm = { version = "2.0.0", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "mock",
    "schema-sync",
    "seaography",
    "with-uuid",
    "rbac",
] }
seaography = "1.1.4"
poem = "3.1.12"
